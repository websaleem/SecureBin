version: 0.2

env:
  # Run commands in bash explicitly: this spec relies on `source`, which POSIX
  # sh does not provide.
  shell: bash
  variables:
    TRACK: "alpha"
    # Pinned so the cache paths below are exact rather than dependent on the
    # image's HOME.
    GRADLE_USER_HOME: /codebuild/gradle-home
  parameter-store:
    UPLOAD_KEYSTORE_BASE64: "/securebin/upload-keystore"
    UPLOAD_STORE_PASSWORD: "/securebin/upload-store-password"
    UPLOAD_KEY_ALIAS: "/securebin/upload-key-alias"
    UPLOAD_KEY_PASSWORD: "/securebin/upload-key-password"
    # CodeBuild resolves this before the build starts, so the stage fails
    # immediately if the parameter is absent.
    SERVICE_ACCOUNT_JSON: "/securebin/google-play-service-account"

phases:
  install:
    runtime-versions:
      nodejs: 20
      java: corretto17
      ruby: 3.2
    commands:
      - echo "Resolving deployment environment from the pipeline branch..."
      - |
        # BRANCH_NAME is passed by the pipeline (infra/ci-cd.yaml). Under
        # CodePipeline, CODEBUILD_SOURCE_VERSION is an S3 artifact ARN and can
        # never identify the branch; checking it sent every run down the dev
        # path, which here would publish a production build to the alpha track.
        case "${BRANCH_NAME:-}" in
          main|refs/heads/main)
            echo "=== Configuring for PRODUCTION (branch: $BRANCH_NAME) ==="
            export SSM_PREFIX=/securebin/prod
            export ENV_FILE=.env.production
            export TRACK_RESOLVED=production
            ;;
          "")
            echo "FATAL: BRANCH_NAME is not set; refusing to guess the deployment environment"; exit 1
            ;;
          *)
            echo "=== Configuring for DEVELOPMENT (branch: $BRANCH_NAME) ==="
            export SSM_PREFIX=/securebin/dev
            export ENV_FILE=.env.development
            export TRACK_RESOLVED=${TRACK:-alpha}
            ;;
        esac
        # Strict resolution. A failed lookup must stop the run: silently falling
        # back would publish a binary pointed at the wrong API.
        export API_URL=$(aws ssm get-parameter --name ${SSM_PREFIX}/api-base-url --query 'Parameter.Value' --output text)
        if [ -z "$API_URL" ] || [ "$API_URL" = "None" ]; then
          echo "FATAL: SSM parameter ${SSM_PREFIX}/api-base-url is missing or empty"; exit 1
        fi
        case "$API_URL" in
          https://*) ;;
          *) echo "FATAL: ${SSM_PREFIX}/api-base-url must be an https URL, got: $API_URL"; exit 1 ;;
        esac
        echo "EXPO_PUBLIC_API_BASE_URL=$API_URL" > $ENV_FILE
        echo "export TRACK_RESOLVED=$TRACK_RESOLVED" > .env.deploy
      - |
        # The standard:7.0 image ships no Android SDK. The build stage installs
        # it too; this stage builds its own signed AAB and needs it as well.
        export ANDROID_HOME="$HOME/android-sdk"
        export ANDROID_SDK_ROOT="$ANDROID_HOME"
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
          && unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools" \
          && mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest" \
          || { echo "FATAL: could not install Android cmdline-tools"; exit 1; }
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
          "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.30.5" \
          > /tmp/sdkmanager.log 2>&1 \
          || { tail -50 /tmp/sdkmanager.log; echo "FATAL: sdkmanager install failed"; exit 1; }
        echo "sdk.dir=$ANDROID_HOME" > android/local.properties
        echo "Android SDK ready at $ANDROID_HOME"
      - npm ci --legacy-peer-deps
      - echo "Installing Fastlane..."
      - gem install fastlane -NV
  pre_build:
    commands:
      - echo "Running Lambda unit tests..."
      - python3 test/test_lambda_units.py
      - echo "Decoding signing and Play credentials..."
      - echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload.jks
      - printf '%s' "$SERVICE_ACCOUNT_JSON" > android/app/api.json
      - chmod 600 android/app/api.json android/app/upload.jks
  build:
    commands:
      - echo "Building signed release AAB..."
      - |
        # Same ABI set as the build stage: Play Store devices are ARM, and
        # compiling the emulator ABIs as well is what used to exhaust the
        # build timeout.
        cd android
        ./gradlew bundleRelease \
          -PreactNativeArchitectures=armeabi-v7a,arm64-v8a \
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
          -PSECUREBIN_UPLOAD_STORE_FILE=upload.jks \
          -PSECUREBIN_UPLOAD_STORE_PASSWORD="$UPLOAD_STORE_PASSWORD" \
          -PSECUREBIN_UPLOAD_KEY_ALIAS="$UPLOAD_KEY_ALIAS" \
          -PSECUREBIN_UPLOAD_KEY_PASSWORD="$UPLOAD_KEY_PASSWORD"
        cd ..
  post_build:
    commands:
      - |
        # post_build runs even when the build phase failed. Uploading then would
        # publish whatever stale AAB happened to be on disk.
        if [ "$CODEBUILD_BUILD_SUCCEEDING" != "1" ]; then
          echo "Build did not succeed; skipping Play Store upload."
        else
          source .env.deploy \
            && echo "Uploading to Google Play ($TRACK_RESOLVED, as a draft release)..." \
            && ( cd android && fastlane deploy track:"$TRACK_RESOLVED" ) \
            && echo "Play Store upload complete."
        fi
      - |
        # Always remove the credentials, including after a failed upload.
        echo "Removing build credentials from the workspace..."
        shred -u android/app/api.json android/app/upload.jks 2>/dev/null \
          || rm -f android/app/api.json android/app/upload.jks

cache:
  paths:
    - '/codebuild/gradle-home/caches/modules-2/**/*'
    - '/codebuild/gradle-home/wrapper/**/*'
