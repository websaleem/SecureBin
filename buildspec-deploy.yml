version: 0.2

env:
  variables:
    TRACK: "alpha"
  parameter-store:
    UPLOAD_KEYSTORE_BASE64: "/securebin/upload-keystore"
    UPLOAD_STORE_PASSWORD: "/securebin/upload-store-password"
    UPLOAD_KEY_ALIAS: "/securebin/upload-key-alias"
    UPLOAD_KEY_PASSWORD: "/securebin/upload-key-password"
    SERVICE_ACCOUNT_JSON: "/securebin/google-play-service-account"

phases:
  install:
    runtime-versions:
      nodejs: 20
      java: corretto17
      ruby: 3.2
    commands:
      - echo "Installing NPM dependencies..."
      - echo "Detecting branch and configuring deployment environment..."
      - |
        if [ "$CODEBUILD_SOURCE_VERSION" = "main" ] || [ "$CODEBUILD_SOURCE_VERSION" = "refs/heads/main" ]; then
          echo "=== Configuring for PRODUCTION (main branch) ==="
          export SSM_PREFIX=/securebin/prod
          export TARGET_BUCKET=securebin.websaleem.com
          export ENV_FILE=.env.production
          export TRACK_RESOLVED=production
        else
          echo "=== Configuring for DEVELOPMENT (dev branch) ==="
          export SSM_PREFIX=/securebin/dev
          export TARGET_BUCKET=dev.securebin.websaleem.com
          export ENV_FILE=.env.development
          export TRACK_RESOLVED=${TRACK:-alpha}
        fi
        # Strict resolution. A failed lookup must stop the build: silently
        # falling back would ship a production binary pointed at dev.
        export API_URL=$(aws ssm get-parameter --name ${SSM_PREFIX}/api-base-url --query 'Parameter.Value' --output text)
        if [ -z "$API_URL" ] || [ "$API_URL" = "None" ]; then
          echo "FATAL: SSM parameter ${SSM_PREFIX}/api-base-url is missing or empty"; exit 1
        fi
        case "$API_URL" in
          https://*) ;;
          *) echo "FATAL: ${SSM_PREFIX}/api-base-url must be an https URL, got: $API_URL"; exit 1 ;;
        esac
        export CF_DIST_ID=$(aws ssm get-parameter --name ${SSM_PREFIX}/cloudfront-dist-id --query 'Parameter.Value' --output text)
        if [ -z "$CF_DIST_ID" ] || [ "$CF_DIST_ID" = "None" ]; then
          echo "FATAL: SSM parameter ${SSM_PREFIX}/cloudfront-dist-id is missing or empty"; exit 1
        fi
        echo "EXPO_PUBLIC_API_BASE_URL=$API_URL" > $ENV_FILE
        cat $ENV_FILE
        echo "export SSM_PREFIX=$SSM_PREFIX" > .env.deploy
        echo "export TARGET_BUCKET=$TARGET_BUCKET" >> .env.deploy
        echo "export TRACK_RESOLVED=$TRACK_RESOLVED" >> .env.deploy
        echo "export CF_DIST_ID=$CF_DIST_ID" >> .env.deploy
      - npm ci --legacy-peer-deps
      - echo "Installing Fastlane..."
      - gem install fastlane -NV
  pre_build:
    commands:
      - echo "Decoding keystore..."
      - echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload.jks
      - echo "Writing service account JSON..."
      - printf '%s' "$SERVICE_ACCOUNT_JSON" > android/app/api.json
      - chmod 600 android/app/api.json android/app/upload.jks
  build:
    commands:
      - echo "Building release AAB..."
      - cd android
      - ./gradlew bundleRelease -PSECUREBIN_UPLOAD_STORE_FILE=upload.jks -PSECUREBIN_UPLOAD_STORE_PASSWORD="$UPLOAD_STORE_PASSWORD" -PSECUREBIN_UPLOAD_KEY_ALIAS="$UPLOAD_KEY_ALIAS" -PSECUREBIN_UPLOAD_KEY_PASSWORD="$UPLOAD_KEY_PASSWORD"
  post_build:
    commands:
      - source .env.deploy && echo "Deploying to Google Play via Fastlane ($TRACK_RESOLVED)..."
      - source .env.deploy && fastlane deploy track:$TRACK_RESOLVED
      - source .env.deploy && echo "Deploying website to S3 ($TARGET_BUCKET)..."
      - source .env.deploy && aws s3 sync website/ s3://$TARGET_BUCKET/ --exclude "*.DS_Store" --cache-control "public, max-age=300"
      - source .env.deploy && aws s3 cp website/index.html s3://$TARGET_BUCKET/ --content-type "text/html" --cache-control "public, max-age=300"
      - source .env.deploy && echo "Invalidating CloudFront distribution ($CF_DIST_ID)..."
      - source .env.deploy && aws cloudfront create-invalidation --distribution-id $CF_DIST_ID --paths "/*" "/"
      - echo "Removing build credentials from the workspace..."
      - shred -u android/app/api.json android/app/upload.jks 2>/dev/null || rm -f android/app/api.json android/app/upload.jks
      - echo "Deployment complete."
