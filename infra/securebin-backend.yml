AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  SecureBin production backend — DynamoDB, S3 uploads bucket, three Lambdas
  behind CloudFront-signed Function URLs. Region: ap-southeast-2.

# ─────────────────────────────────────────────────────────────────────────────
# THIS TEMPLATE MIRRORS WHAT PRODUCTION ACTUALLY RUNS.
#
# It previously described an HTTP API (ApiGatewayV2) fronting differently-named
# Lambdas and a `securebin-uploads-<account>-<env>` bucket. Production runs none
# of that. The live stack — verified against the account — is:
#
#   * Lambda Function URLs with AuthType AWS_IAM, not API Gateway. CloudFront
#     reaches them through Origin Access Control, which SigV4-signs each
#     request, so the URLs cannot be called directly from the internet.
#   * Functions named sbGetPresignURL / sbCategorizeImage / sbGetJobResult on
#     python3.14, using three pre-existing hand-made IAM roles.
#   * Uploads bucket `securebin-image-s3-uploads`, table
#     `securebin-categorize-jobs`.
#
# Deploying the old template would NOT have updated production; it would have
# built a parallel stack alongside it. Keeping this file honest matters more
# than keeping it aspirational — an infrastructure template that describes
# something other than reality is worse than no template, because it invites
# exactly that mistake.
#
# IMAGE RETENTION. Uploaded images are expired solely by the bucket lifecycle
# rule below (one day). The categorize Lambda deliberately does NOT delete them:
# one mechanism, applied by S3 itself, covers every object — including uploads
# whose trigger never fired or whose function timed out, which application-side
# deletion could never reach. The privacy policy is written to match this rule,
# so the two must be changed together.
# ─────────────────────────────────────────────────────────────────────────────

Parameters:
  UploadsBucketName:
    Type: String
    Default: securebin-image-s3-uploads

  JobsTableName:
    Type: String
    Default: securebin-categorize-jobs

  BedrockModelId:
    Type: String
    Default: amazon.nova-lite-v1:0

  UploadRetentionDays:
    Type: Number
    Default: 1
    Description: >-
      Days before an uploaded image is expired by S3. This is the ONLY retention
      mechanism, and website/privacy.html states 24 hours — change both together.

  DistributionId:
    Type: String
    Default: E90FW67SOXKZN
    Description: >-
      CloudFront distribution permitted to invoke the Function URLs. The
      distribution itself is not managed here (it also fronts the marketing site
      and predates this template); only the invoke permissions that reference it.

Resources:
  # ───────── DynamoDB ─────────
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref JobsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      # NOTE: the presign Lambda writes a `ttl` attribute on every row, but TTL
      # is DISABLED on the live table, so nothing expires and job rows (jobId,
      # council, state, result) accumulate indefinitely. Enabling this is a
      # behaviour change to production, so it is left off here to match reality.
      # Turn it on deliberately:
      # TimeToLiveSpecification:
      #   AttributeName: ttl
      #   Enabled: true

  # ───────── Uploads bucket ─────────
  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref UploadsBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          # The single retention mechanism for user images. See the header.
          - Id: securebin-expire-uploads
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: !Ref UploadRetentionDays
          # Multipart uploads that never complete are invisible to the rule
          # above and would otherwise be billed indefinitely.
          - Id: securebin-abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:Put
            Function: !GetAtt CategorizeImageLambda.Arn
          - Event: s3:ObjectCreated:Post
            Function: !GetAtt CategorizeImageLambda.Arn

  UploadsBucketInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt CategorizeImageLambda.Arn
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:s3:::${UploadsBucketName}"

  # ───────── IAM ─────────
  # Scoped to uploads/* rather than the whole bucket: the presign Lambda mints
  # keys only under that prefix, so nothing needs access outside it.
  GetPresignUrlRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: securebin-s3-presign-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: securebin-s3-presign-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${UploadsBucketName}/uploads/*"
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${JobsTableName}"

  CategorizeImageRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: securebin-categorize-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: securebin-categorize-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # s3:DeleteObject is deliberately absent. The live role still
              # carries it from when the function deleted images itself; now
              # that retention is the lifecycle rule's job, the function has no
              # reason to be able to delete anything.
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${UploadsBucketName}/uploads/*"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${JobsTableName}"
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}"

  GetJobResultRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: securebin-categorize-result-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: securebin-categorize-result-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${JobsTableName}"

  # ───────── Lambdas ─────────
  # Code is deployed by buildspec-deploy.yml, not inlined here.
  GetPresignUrlLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: sbGetPresignURL
      Runtime: python3.14
      Handler: lambda_function.lambda_handler
      Role: !GetAtt GetPresignUrlRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          BUCKET_NAME: !Ref UploadsBucketName
          TABLE_NAME: !Ref JobsTableName
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 503}

  CategorizeImageLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: sbCategorizeImage
      Runtime: python3.14
      Handler: lambda_function.lambda_handler
      Role: !GetAtt CategorizeImageRole.Arn
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          TABLE_NAME: !Ref JobsTableName
          MODEL_ID: !Ref BedrockModelId
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"ok": False}

  GetJobResultLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: sbGetJobResult
      Runtime: python3.14
      Handler: lambda_function.lambda_handler
      Role: !GetAtt GetJobResultRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref JobsTableName
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 503}

  # ───────── Function URLs ─────────
  # AWS_IAM, never NONE. These URLs are public DNS names; IAM auth is the only
  # thing preventing direct invocation that bypasses CloudFront entirely.
  GetPresignUrlFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt GetPresignUrlLambda.Arn
      AuthType: AWS_IAM

  GetJobResultFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt GetJobResultLambda.Arn
      AuthType: AWS_IAM

  # Only this distribution may invoke them, and only via the Function URL.
  GetPresignUrlCloudFrontPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !GetAtt GetPresignUrlLambda.Arn
      Principal: cloudfront.amazonaws.com
      FunctionUrlAuthType: AWS_IAM
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionId}"

  GetJobResultCloudFrontPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !GetAtt GetJobResultLambda.Arn
      Principal: cloudfront.amazonaws.com
      FunctionUrlAuthType: AWS_IAM
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionId}"

  # ───────── CloudFront Origin Access Control ─────────
  # SigV4-signs every origin request so the IAM-authed Function URLs accept it.
  PresignOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: securebin-presign-oac
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  JobResultOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: securebin-categorize-job-oac
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

Outputs:
  UploadsBucket:
    Value: !Ref UploadsBucket
  JobsTable:
    Value: !Ref JobsTable
  PresignFunctionUrl:
    Description: Wire as the CloudFront /presign origin, with PresignOAC attached
    Value: !GetAtt GetPresignUrlFunctionUrl.FunctionUrl
  JobResultFunctionUrl:
    Description: Wire as the CloudFront /result/* origin, with JobResultOAC attached
    Value: !GetAtt GetJobResultFunctionUrl.FunctionUrl
  PresignOACId:
    Value: !Ref PresignOAC
  JobResultOACId:
    Value: !Ref JobResultOAC
