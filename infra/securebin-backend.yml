AWSTemplateFormatVersion: '2010-09-09'
Description: SecureBin Backend Infrastructure — DynamoDB, S3, Lambdas, and HTTP API

Parameters:
  BedrockModelId:
    Type: String
    Default: 'amazon.nova-lite-v1:0'
    Description: The Bedrock model ID for image categorization
  ProdCloudFrontUrl:
    Type: String
    Default: 'https://securebin.websaleem.com'
    Description: Production CloudFront Origin URL
  DevCloudFrontUrl:
    Type: String
    Default: 'https://dev.securebin.websaleem.com'
    Description: Development CloudFront Origin URL
  CategorizeMaxConcurrency:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 100
    Description: >-
      Reserved concurrency for the Bedrock-invoking Processor Lambda. This is
      the hard ceiling on parallel model calls, and therefore on spend rate.
  UploadsBucketName:
    Type: String
    Default: 'securebin-image-s3-uploads'
    Description: >-
      Name of the uploads bucket. IAM policies and the S3 invoke permission
      build this ARN from the name rather than !GetAtt, because the bucket's
      notification config already points at the Processor Lambda and a GetAtt
      would close a circular dependency (bucket -> lambda -> role -> bucket).
  AllowLocalhostOrigin:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Whether http://localhost:8081 is an accepted CORS origin. Must stay
      'false' in production; set 'true' only on a development stack.

Conditions:
  IncludeLocalhostOrigin: !Equals [!Ref AllowLocalhostOrigin, 'true']

Resources:
  # ───────── DynamoDB Table ─────────
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: securebin-categorize-jobs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  # ───────── S3 Bucket ─────────
  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref UploadsBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - PUT
              - POST
            AllowedOrigins: !If
              - IncludeLocalhostOrigin
              - ['https://securebin.websaleem.com', 'https://dev.securebin.websaleem.com', !Ref ProdCloudFrontUrl, !Ref DevCloudFrontUrl, 'http://localhost:8081']
              - ['https://securebin.websaleem.com', 'https://dev.securebin.websaleem.com', !Ref ProdCloudFrontUrl, !Ref DevCloudFrontUrl]
            MaxAge: 3600
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          # Backstop only — the Processor Lambda deletes each object as soon as
          # it has been classified, per the published privacy policy.
          - Id: DeleteAfter1Day
            Status: Enabled
            ExpirationInDays: 1
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt CategorizeImageLambda.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/

  UploadsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub "arn:aws:s3:::${UploadsBucketName}"
              - !Sub "arn:aws:s3:::${UploadsBucketName}/*"
            Condition:
              Bool:
                'aws:SecureTransport': false

  UploadsBucketInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CategorizeImageLambda
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:s3:::${UploadsBucketName}"

  # ───────── IAM Roles ─────────
  GetPresignUrlRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GetPresignUrlPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt JobsTable.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "arn:aws:s3:::${UploadsBucketName}/*"

  CategorizeImageRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CategorizeImagePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt JobsTable.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub "arn:aws:s3:::${UploadsBucketName}/*"
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt CategorizeImageDLQ.Arn
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}"
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}"

  GetJobResultRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GetJobResultPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource: !GetAtt JobsTable.Arn

  # ───────── Lambda Functions ─────────
  GetPresignUrlLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: sbGetPresignURL
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      Role: !GetAtt GetPresignUrlRole.Arn
      Timeout: 10
      MemorySize: 256
      # Staged by scripts/package_lambdas.sh — includes shared/councils.py
      Code: ../build/get_presign_url/
      Environment:
        Variables:
          TABLE_NAME: !Ref JobsTable
          BUCKET_NAME: !Ref UploadsBucketName

  CategorizeImageDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: securebin-categorize-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  CategorizeImageLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: sbCategorizeImage
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      Role: !GetAtt CategorizeImageRole.Arn
      Timeout: 30
      MemorySize: 512
      # This is the only function that spends money per invocation. Cap it so a
      # burst of uploads cannot run up an unbounded Bedrock bill.
      ReservedConcurrentExecutions: !Ref CategorizeMaxConcurrency
      DeadLetterConfig:
        TargetArn: !GetAtt CategorizeImageDLQ.Arn
      # Staged by scripts/package_lambdas.sh — includes shared/councils.py
      Code: ../build/categorize_image/
      Environment:
        Variables:
          TABLE_NAME: !Ref JobsTable
          MODEL_ID: !Ref BedrockModelId

  GetJobResultLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: sbGetJobResult
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      Role: !GetAtt GetJobResultRole.Arn
      Timeout: 10
      MemorySize: 256
      Code: ../build/get_job_result/
      Environment:
        Variables:
          TABLE_NAME: !Ref JobsTable

  # ───────── HTTP API Gateway ─────────
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: SecureBinHttpApi
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: !If
          - IncludeLocalhostOrigin
          - ['https://securebin.websaleem.com', 'https://dev.securebin.websaleem.com', !Ref ProdCloudFrontUrl, !Ref DevCloudFrontUrl, 'http://localhost:8081']
          - ['https://securebin.websaleem.com', 'https://dev.securebin.websaleem.com', !Ref ProdCloudFrontUrl, !Ref DevCloudFrontUrl]
        AllowMethods:
          - GET
          - OPTIONS
        AllowHeaders:
          - '*'

  # Integrations
  GetPresignUrlIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt GetPresignUrlLambda.Arn
      PayloadFormatVersion: '2.0'

  GetJobResultIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt GetJobResultLambda.Arn
      PayloadFormatVersion: '2.0'

  # Routes
  GetPresignUrlRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /presign'
      Target: !Sub "integrations/${GetPresignUrlIntegration}"

  GetJobResultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /result/{jobId}'
      Target: !Sub "integrations/${GetJobResultIntegration}"

  # Stage
  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: prod
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      RouteSettings:
        # /presign is the entry point to the billable pipeline, so it is held
        # well below the stage default. /result is cheap and polled 30x per scan.
        'GET /presign':
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 5
        'GET /result/{jobId}':
          ThrottlingBurstLimit: 40
          ThrottlingRateLimit: 20

  # Permissions for API Gateway to invoke Lambdas
  GetPresignUrlApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref GetPresignUrlLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/presign"

  GetJobResultApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref GetJobResultLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/result/*"

  # ───────── CloudFront Security Headers ─────────
  # Attach this policy to the website distribution's default cache behaviour.
  # The distribution itself is managed outside this template.
  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: SecureBinSecurityHeaders
        Comment: Baseline security headers for the SecureBin marketing site
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: >-
              default-src 'self';
              script-src 'self' 'unsafe-inline';
              style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com;
              font-src 'self' https://cdnjs.cloudflare.com;
              img-src 'self' data:;
              connect-src 'self' https://formspree.io;
              frame-ancestors 'none';
              base-uri 'self';
              form-action https://formspree.io
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: 'camera=(), microphone=(), geolocation=(), interest-cohort=()'
              Override: true

Outputs:
  ApiEndpoint:
    Description: Base URL for the SecureBin API
    Value: !GetAtt HttpApi.ApiEndpoint
  SecurityHeadersPolicyId:
    Description: Attach to the website CloudFront distribution's cache behaviour
    Value: !Ref SecurityHeadersPolicy
  CategorizeDLQUrl:
    Description: Dead-letter queue for Processor Lambda invocations that never succeeded
    Value: !Ref CategorizeImageDLQ
