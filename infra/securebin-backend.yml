AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  SecureBin backend — DynamoDB, S3 uploads bucket, three Lambdas behind
  CloudFront-signed Function URLs. One template, both environments.
  Region: ap-southeast-2.

# ─────────────────────────────────────────────────────────────────────────────
# THIS TEMPLATE OWNS PRODUCTION.
#
# It did not always. Production was built by hand and lived outside
# CloudFormation entirely, while two stacks named securebin-prod-backend and
# securebin-dev-backend held a parallel, unused copy of the same shapes. The
# real functions were therefore only deployable by `aws lambda
# update-function-code`, and this file — however accurate — described nothing
# the account actually ran. The live resources were imported into
# securebin-backend-prod (see scripts/import-prod-backend.sh) so that the
# description and the reality are the same objects.
#
# CODE IS DEPLOYED THROUGH THIS TEMPLATE, from S3. Earlier revisions carried an
# inline `ZipFile` stub returning 503 and a comment claiming the CI buildspec
# deployed the real code. No buildspec ever did. Had anyone run
# `cloudformation deploy` against that version, CloudFormation would have
# faithfully replaced the production handlers with the stub. Code now arrives as
# a content-addressed S3 object (scripts/deploy-backend.sh), so the template can
# never be a downgrade: the artifact key IS the version.
#
# WHAT THIS TEMPLATE DOES NOT OWN. The CloudFront distributions. Prod's also
# fronts the marketing site and predates all of this; dev's is API-only. Both
# are referenced by id as a parameter, and only the invoke permissions that
# name them are managed here. Adopting a distribution means describing every
# behaviour and origin exactly, and a single omission is silently destructive on
# the next update — not a trade worth making for two distributions that change
# once a year.
#
# IMAGE RETENTION. Uploaded images are expired solely by the bucket lifecycle
# rule below (one day). The categorize Lambda deliberately does NOT delete them:
# one mechanism, applied by S3 itself, covers every object — including uploads
# whose trigger never fired or whose function timed out, which application-side
# deletion could never reach. website/privacy.html is written to match this
# rule, so the two must be changed together.
# ─────────────────────────────────────────────────────────────────────────────

Parameters:
  ResourceSuffix:
    Type: String
    Default: ''
    AllowedValues: ['', '-dev']
    Description: >-
      Appended to every physically-named resource. Empty for production, whose
      names predate this template and cannot change without replacing the
      functions the live distribution points at; "-dev" for the dev stack.

  UploadsBucketName:
    Type: String
    Default: securebin-image-s3-uploads

  JobsTableName:
    Type: String
    Default: securebin-categorize-jobs

  BedrockModelId:
    Type: String
    Default: amazon.nova-lite-v1:0

  UploadRetentionDays:
    Type: Number
    Default: 1
    Description: >-
      Days before an uploaded image is expired by S3. This is the ONLY retention
      mechanism, and website/privacy.html states 24 hours — change both together.

  DistributionId:
    Type: String
    Description: >-
      CloudFront distribution permitted to invoke the Function URLs. The
      distribution itself is not managed here; only the invoke permissions.

  ArtifactsBucket:
    Type: String
    Description: S3 bucket holding the packaged Lambda zips.

  PresignCodeKey:
    Type: String
    Description: S3 key of the get_presign_url package (content-addressed).

  CategorizeCodeKey:
    Type: String
    Description: S3 key of the categorize_image package (content-addressed).

  JobResultCodeKey:
    Type: String
    Description: S3 key of the get_job_result package (content-addressed).

Resources:
  # ───────── DynamoDB ─────────
  JobsTable:
    Type: AWS::DynamoDB::Table
    # Holds in-flight jobs. Retained so a stack mistake cannot take the table
    # with it; the rows expire on their own via TTL.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref JobsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      # The presign Lambda stamps every row with `ttl` (createdAt + 24h). Without
      # this block that attribute is inert and job rows — jobId, council, state,
      # and the classification result — accumulate indefinitely.
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ───────── Uploads bucket ─────────
  # Every property S3 reports on the live bucket is restated here. An omitted
  # property is not "left alone" by an update — it is reset to the default, so
  # leaving out the CORS rules or the ownership controls would break uploads or
  # re-enable ACLs the first time this stack is deployed.
  UploadsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref UploadsBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
            # Customer-provided keys would let an uploader supply their own key
            # and make the object unreadable to the categorizer.
            BlockedEncryptionTypes:
              EncryptionType:
                - SSE-C
      CorsConfiguration:
        # The app POSTs the image straight to S3 with the presigned form fields.
        CorsRules:
          - AllowedHeaders: ['Content-Type', '*']
            AllowedMethods: [PUT, POST, GET]
            AllowedOrigins: ['*']
      LifecycleConfiguration:
        Rules:
          # The single retention mechanism for user images. See the header.
          - Id: securebin-expire-uploads
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: !Ref UploadRetentionDays
          # Multipart uploads that never complete are invisible to the rule
          # above and would otherwise be billed indefinitely.
          - Id: securebin-abort-incomplete-multipart
            Status: Enabled
            Prefix: ''
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      NotificationConfiguration:
        LambdaConfigurations:
          # Prefix-filtered: without it, any future object written anywhere in
          # the bucket would invoke Bedrock.
          - Event: s3:ObjectCreated:Put
            Function: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:sbCategorizeImage${ResourceSuffix}"
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/
          - Event: s3:ObjectCreated:Post
            Function: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:sbCategorizeImage${ResourceSuffix}"
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/
    DependsOn: UploadsBucketInvokePermission

  UploadsBucketInvokePermission:
    Type: AWS::Lambda::Permission
    DependsOn: CategorizeImageLambda
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:sbCategorizeImage${ResourceSuffix}"
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:s3:::${UploadsBucketName}"

  # ───────── IAM ─────────
  # Scoped to uploads/* rather than the whole bucket: the presign Lambda mints
  # keys only under that prefix, so nothing needs access outside it.
  GetPresignUrlRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "securebin-s3-presign-role${ResourceSuffix}"
      Description: Allows Lambda functions to call AWS services on your behalf.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: securebin-s3-presign-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${UploadsBucketName}/uploads/*"
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${JobsTableName}"

  CategorizeImageRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "securebin-categorize-role${ResourceSuffix}"
      Description: Allows Lambda functions to call AWS services on your behalf.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: securebin-categorize-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # s3:DeleteObject is deliberately absent. The role carried it from
              # when the function deleted images itself; now that retention is
              # the lifecycle rule's job, nothing here should be able to delete.
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${UploadsBucketName}/uploads/*"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${JobsTableName}"
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}"

  GetJobResultRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "securebin-categorize-result-role${ResourceSuffix}"
      Description: Allows Lambda functions to call AWS services on your behalf.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: securebin-categorize-result-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${JobsTableName}"

  # ───────── Lambdas ─────────
  # Code comes from S3, keyed by the sha256 of the package. Deploying the same
  # source twice is a no-op; deploying new source changes the key and therefore
  # the function. See scripts/deploy-backend.sh.
  GetPresignUrlLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "sbGetPresignURL${ResourceSuffix}"
      Runtime: python3.14
      Handler: lambda_function.lambda_handler
      Role: !GetAtt GetPresignUrlRole.Arn
      Timeout: 10
      MemorySize: 256
      Architectures: [x86_64]
      Environment:
        Variables:
          BUCKET_NAME: !Ref UploadsBucketName
          TABLE_NAME: !Ref JobsTableName
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: !Ref PresignCodeKey

  CategorizeImageLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "sbCategorizeImage${ResourceSuffix}"
      Runtime: python3.14
      Handler: lambda_function.lambda_handler
      Role: !GetAtt CategorizeImageRole.Arn
      Timeout: 30
      MemorySize: 512
      Architectures: [x86_64]
      Environment:
        Variables:
          TABLE_NAME: !Ref JobsTableName
          MODEL_ID: !Ref BedrockModelId
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: !Ref CategorizeCodeKey

  GetJobResultLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "sbGetJobResult${ResourceSuffix}"
      Runtime: python3.14
      Handler: lambda_function.lambda_handler
      Role: !GetAtt GetJobResultRole.Arn
      Timeout: 10
      MemorySize: 256
      Architectures: [x86_64]
      Environment:
        Variables:
          TABLE_NAME: !Ref JobsTableName
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: !Ref JobResultCodeKey

  # ───────── Function URLs ─────────
  # AWS_IAM, never NONE. These URLs are public DNS names; IAM auth is the only
  # thing preventing direct invocation that bypasses CloudFront entirely.
  # CategorizeImageLambda has no URL: it is invoked by S3, and the one it used
  # to carry was an unreferenced public hostname.
  # TargetFunctionArn is built from parameters with !Sub rather than read with
  # !GetAtt. Both resolve to the same ARN, but !GetAtt is a resource attribute
  # that CloudFormation cannot evaluate while planning, so it reports
  # TargetFunctionArn as a possible change with RequiresRecreation: Always on
  # every single deploy. Recreating one of these URLs mints a new hostname while
  # the distribution still points at the old one — a silent outage of /presign.
  # A literal !Sub is plan-time comparable, so an unchanged URL shows up as
  # unchanged. DependsOn replaces the ordering that !GetAtt implied.
  GetPresignUrlFunctionUrl:
    Type: AWS::Lambda::Url
    DependsOn: GetPresignUrlLambda
    Properties:
      TargetFunctionArn: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:sbGetPresignURL${ResourceSuffix}"
      AuthType: AWS_IAM

  GetJobResultFunctionUrl:
    Type: AWS::Lambda::Url
    DependsOn: GetJobResultLambda
    Properties:
      TargetFunctionArn: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:sbGetJobResult${ResourceSuffix}"
      AuthType: AWS_IAM

  # Only this distribution may invoke them, and only via the Function URL.
  #
  # TWO statements per function, and both are required. An OAC-signed request is
  # authorized twice: the Function URL front door checks
  # lambda:InvokeFunctionUrl, and invoking the function behind it checks
  # lambda:InvokeFunction. With only the first, every request returns
  # 403 AccessDeniedException before the handler runs — and it looks exactly
  # like a signing failure, because the denial arrives from Lambda's front door
  # with no log stream to inspect. Production's hand-made policy carried both
  # (the console adds the pair), which is why a template with just
  # InvokeFunctionUrl described prod correctly enough to deploy and still broke
  # a freshly built environment. Verified by bisection against a throwaway
  # distribution: InvokeFunctionUrl alone 403s, adding InvokeFunction gives 200.
  #
  # FunctionUrlAuthType is deliberately set only on the InvokeFunctionUrl
  # statements. On an InvokeFunction statement it adds a
  # lambda:FunctionUrlAuthType condition to a call that is not the URL
  # front-door check.
  GetPresignUrlCloudFrontPermission:
    Type: AWS::Lambda::Permission
    DependsOn: GetPresignUrlLambda
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:sbGetPresignURL${ResourceSuffix}"
      Principal: cloudfront.amazonaws.com
      FunctionUrlAuthType: AWS_IAM
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionId}"

  GetPresignUrlCloudFrontInvokePermission:
    Type: AWS::Lambda::Permission
    DependsOn: GetPresignUrlLambda
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:sbGetPresignURL${ResourceSuffix}"
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionId}"

  GetJobResultCloudFrontPermission:
    Type: AWS::Lambda::Permission
    DependsOn: GetJobResultLambda
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:sbGetJobResult${ResourceSuffix}"
      Principal: cloudfront.amazonaws.com
      FunctionUrlAuthType: AWS_IAM
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionId}"

  GetJobResultCloudFrontInvokePermission:
    Type: AWS::Lambda::Permission
    DependsOn: GetJobResultLambda
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:sbGetJobResult${ResourceSuffix}"
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionId}"

  # ───────── CloudFront Origin Access Control ─────────
  # SigV4-signs every origin request so the IAM-authed Function URLs accept it.
  PresignOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "securebin-presign-oac${ResourceSuffix}"
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  JobResultOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "securebin-categorize-job-oac${ResourceSuffix}"
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

Outputs:
  UploadsBucket:
    Value: !Ref UploadsBucket
  JobsTable:
    Value: !Ref JobsTable
  PresignFunctionUrl:
    Description: Wire as the CloudFront /presign origin, with PresignOAC attached
    Value: !GetAtt GetPresignUrlFunctionUrl.FunctionUrl
  JobResultFunctionUrl:
    Description: Wire as the CloudFront /result/* origin, with JobResultOAC attached
    Value: !GetAtt GetJobResultFunctionUrl.FunctionUrl
  PresignOACId:
    Value: !Ref PresignOAC
  JobResultOACId:
    Value: !Ref JobResultOAC
