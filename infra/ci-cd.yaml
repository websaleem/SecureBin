AWSTemplateFormatVersion: '2010-09-09'
Description: CI/CD Pipeline for SecureBin Mobile Application using AWS CodePipeline and CodeConnections

Parameters:
  FullRepositoryId:
    Type: String
    Description: GitHub Repository ID (e.g., your-org/SecureBin)
  BranchName:
    Type: String
    Default: main
    Description: The branch to build and deploy
  CodeConnectionArn:
    Type: String
    Description: ARN of the AWS CodeConnection (created in AWS Console)
  NotificationEmail:
    Type: String
    Description: Email address for build notifications
    
Resources:
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - ssm:GetParameters
                Resource: 
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/securebin/*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetBucketAcl
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:DeleteObject
                Resource: 
                  - !GetAtt ArtifactsBucket.Arn
                  - !Sub "${ArtifactsBucket.Arn}/*"
                  - "arn:aws:s3:::securebin.websaleem.com"
                  - "arn:aws:s3:::securebin.websaleem.com/*"
                  - "arn:aws:s3:::dev.securebin.websaleem.com"
                  - "arn:aws:s3:::dev.securebin.websaleem.com/*"
              - Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                Resource: 
                  - !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/SECUREBIN_PROD_CF_DIST_ID"
                  - !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/SECUREBIN_DEV_CF_DIST_ID"
                  - !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/*"

  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodePipelinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetBucketAcl
                  - s3:GetBucketLocation
                Resource: 
                  - !GetAtt ArtifactsBucket.Arn
                  - !Sub "${ArtifactsBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource: '*'
              - Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                Resource: !Ref CodeConnectionArn

  SecureBinBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: SecureBin-Build
      Description: Builds the SecureBin Android App Bundle
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: NODE_VERSION
            Value: '20'
          - Name: JAVA_VERSION
            Value: '17'
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml

  SecureBinPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: SecureBin-Pipeline
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactsBucket
      Stages:
        - Name: Source
          Actions:
            - Name: SourceAction
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              OutputArtifacts:
                - Name: SourceArtifact
              Configuration:
                ConnectionArn: !Ref CodeConnectionArn
                FullRepositoryId: !Ref FullRepositoryId
                BranchName: !Ref BranchName
        - Name: Build
          Actions:
            - Name: BuildAction
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BuildArtifact
              Configuration:
                ProjectName: !Ref SecureBinBuildProject
        - Name: Approval
          Actions:
            - Name: ManualApproval
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: '1'
              Configuration:
                CustomData: "Approve the build to deploy to Google Play Store"

  BuildNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: SecureBinPipelineNotifications

  BuildNotificationSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref BuildNotificationTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  PipelineEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: SecureBinPipelineStatusRule
      Description: Notify on CodePipeline state changes for SecureBin
      EventPattern:
        source:
          - aws.codepipeline
        detail-type:
          - CodePipeline Pipeline Execution State Change
        detail:
          pipeline:
            - !Ref SecureBinPipeline
          state:
            - SUCCEEDED
            - FAILED
      Targets:
        - Arn: !Ref BuildNotificationTopic
          Id: TargetFunctionV1

  EventRuleTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref BuildNotificationTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref BuildNotificationTopic

Outputs:
  PipelineUrl:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${SecureBinPipeline}/view"
