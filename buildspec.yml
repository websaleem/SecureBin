version: 0.2

env:
  parameter-store:
    UPLOAD_KEYSTORE_BASE64: "/securebin/upload-keystore"
    UPLOAD_STORE_PASSWORD: "/securebin/upload-store-password"
    UPLOAD_KEY_ALIAS: "/securebin/upload-key-alias"
    UPLOAD_KEY_PASSWORD: "/securebin/upload-key-password"
    API_BASE_URL: "/securebin/prod/api-base-url"

phases:
  install:
    runtime-versions:
      nodejs: 20
      java: corretto17
    commands:
      - echo "Installing dependencies..."
      - echo "EXPO_PUBLIC_API_BASE_URL=$API_BASE_URL" > .env.production
      - npm ci --legacy-peer-deps
  pre_build:
    commands:
      - echo "Decoding keystore..."
      - echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload.jks
  build:
    commands:
      - echo "Building release AAB..."
      - cd android
      - ./gradlew bundleRelease -PSECUREBIN_UPLOAD_STORE_FILE=upload.jks -PSECUREBIN_UPLOAD_STORE_PASSWORD="$UPLOAD_STORE_PASSWORD" -PSECUREBIN_UPLOAD_KEY_ALIAS="$UPLOAD_KEY_ALIAS" -PSECUREBIN_UPLOAD_KEY_PASSWORD="$UPLOAD_KEY_PASSWORD"
      - cd ..

artifacts:
  files:
    - android/app/build/outputs/bundle/release/app-release.aab
  name: securebin-release-aab
